<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Lock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24" class="lock-mini"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <div class="brand-text">
          <span class="title">Instagram Lock</span>
          <span class="version">v1.1.0</span>
        </div>
      </div>
      <button id="btn-settings" class="icon-btn" title="Open Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </header>

    <!-- Status Card -->
    <section class="status-card">
      <div class="status-indicator">
        <span id="status-dot" class="dot"></span>
        <span id="status-text" class="status-label">Checking...</span>
      </div>
      <p id="status-subtext" class="status-desc">Synchronizing with active session</p>
    </section>

    <!-- Direct Unlock Section (visible when locked) -->
    <section id="unlock-section" class="unlock-section hidden">
      <form id="popup-unlock-form" class="unlock-form">
        <label for="popup-pw-input" class="sr-only">Master password</label>
        <input type="password" id="popup-pw-input" class="popup-input" placeholder="Enter password to unlock..." maxlength="128" required autocomplete="current-password">
        <div id="popup-unlock-error" class="popup-error hidden" role="alert" aria-live="polite"></div>
        <button type="submit" id="btn-popup-unlock" class="btn-primary">
          <span>Unlock Session</span>
        </button>
      </form>
    </section>

    <!-- Main Lock Action (visible when unlocked) -->
    <section id="lock-section" class="action-section">
      <button id="btn-lock-now" class="btn-primary" disabled>
        <svg viewBox="0 0 24 24" class="btn-icon"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span>Lock Instagram Now</span>
      </button>
    </section>

    <!-- Info Footer -->
    <footer class="popup-footer">
      <div class="info-row">
        <span class="info-label">Protection Mode:</span>
        <span id="info-scope" class="info-val">Full Site</span>
      </div>
      <div class="info-row">
        <span class="info-label">Inactivity Timeout:</span>
        <span id="info-timeout" class="info-val">5 min</span>
      </div>
      <div class="info-row">
        <span class="info-label">Lock on Reopen:</span>
        <label class="mini-switch" title="Automatically lock whenever all Instagram tabs are closed">
          <input type="checkbox" id="popup-toggle-lock-close">
          <span class="mini-slider"></span>
        </label>
      </div>
      <div class="info-row">
        <span class="info-label">Quick Shortcut:</span>
        <span class="info-val">Alt+Shift+L</span>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
